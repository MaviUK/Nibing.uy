name: Preview 1 Squeegee owner-test readiness (GET only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-preview-test-readiness.yml

permissions:
  contents: read

jobs:
  verify-preview-only-session-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Preview 1 owner page and private boolean-only runtime readiness
        shell: python
        run: |
          import urllib.request, urllib.error, json, time
          host="https://deploy-preview-77--nibinguy.netlify.app"
          audit=host+"/.netlify/functions/squeegeeTestRuntimeCheck"
          owner=host+"/api/squeegee-preview-test"
          for attempt in range(1,19):
              try:
                  req=urllib.request.Request(audit,headers={"Accept":"application/json","User-Agent":"NI-Bin-Guy-Preview-ReadOnly-Check"})
                  with urllib.request.urlopen(req,timeout=25) as response:
                      body=json.loads(response.read(10000))
                      code=response.status
              except urllib.error.HTTPError as exc:
                  code=exc.code
                  body={}
              except Exception:
                  code=0
                  body={}
              if code==200 and body.get("readOnly") is True and "modernScopeValid" in (body.get("checks") or {}):
                  checks=body.get("checks") or {}
                  for name,value in sorted(checks.items()):
                      print(name+":", "PASS" if value else "FAIL")
                  print("READINESS:",json.dumps(checks,sort_keys=True))
                  required=("apiKeyAvailable","resendAvailable",
                            "modernContextWaitUntil","modernSiteIdPresent",
                            "modernScopeValid","modernOwnerAccessGate",
                            "leaderboardProofSecretAvailable")
                  for key in required:
                      if not checks.get(key): raise SystemExit("Required Preview 1 readiness check failed: "+key)
                  try:
                      with urllib.request.urlopen(owner,timeout=25) as response:
                          html=response.read(20000).decode("utf8")
                          owner_ok=response.status==200 and "Squeegee test" in html
                  except Exception:
                      owner_ok=False
                  print("MOBILE_OWNER_TEST_PAGE:", "PASS" if owner_ok else "FAIL")
                  if not owner_ok: raise SystemExit("Owner page not reachable")
                  break
              print("GET-only audit attempt",attempt,"status",code)
              if attempt==18: raise SystemExit("Preview readiness endpoint not deployed")
              time.sleep(10)
