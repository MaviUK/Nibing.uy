name: Production CAS ledger release preflight (synthetic only)
on:
  push:
    branches:
      - main
    paths:
      - 'netlify/functions/squeegeeProductionPreflight.mjs'
      - '.github/workflows/production-cas-preflight.yml'
  workflow_dispatch:
jobs:
  production-cas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact Netlify production runtime CAS without booking writes
        shell: bash
        run: |
          set -eu
          for attempt in $(seq 1 60); do
            body="$(curl -fsSL --connect-timeout 5 --max-time 12               'https://nibing.uy/api/squeegee-production-preflight' 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q '"passed":true'; then
              echo 'PASS: production-only Netlify Blobs create-once, ETag CAS, stale-ETag rejection and readback'
              exit 0
            fi
            sleep 5
          done
          echo 'FAIL: production CAS could not be verified; do not enable booking writes'
          exit 1
