name: Verify NI Bin Guy round cycle against Squeegee (GET only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-round-cycle-check.yml

permissions:
  contents: read

jobs:
  read-only-round-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check round dates and whether account groups exist (no UUIDs)
        shell: python
        run: |
          import json,time,urllib.request,urllib.error
          url="https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeRoundCycleAudit"
          for attempt in range(1,12):
              req=urllib.request.Request(url,headers={"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as res:
                      status=res.status
                      data=json.loads(res.read(10000))
              except urllib.error.HTTPError as err:
                  status=err.code
                  try: data=json.loads(err.read(1000))
                  except Exception: data={}
              except Exception:
                  status=0
                  data={}
              if status==200 and data.get("readOnly") and data.get("connected"):
                  print("SQUEEGEE_READONLY_CONNECTED:",data.get("connected"))
                  print("ACCOUNT_GROUP_COUNT:",data.get("groupsAvailable"))
                  print("ROUND_DATES_AND_AVAILABILITY:",json.dumps(data.get("results"),sort_keys=True))
                  break
              print("ATTEMPT:",attempt,"STATUS:",status)
              if attempt==11: raise SystemExit("Preview GET-only mapping check unavailable")
              time.sleep(8)
