name: Squeegee Preview 1 anonymous round-map audit
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-round-map-audit.yml

permissions:
  contents: read

jobs:
  read-only-round-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query Preview 1 for anonymized town-to-group counts (GET only)
        shell: python
        run: |
          import json, time, urllib.request, urllib.error
          url = "https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeRoundAudit"
          for attempt in range(1,11):
              request=urllib.request.Request(url,headers={
                  "Accept":"application/json",
                  "User-Agent":"NI-Bin-Guy-Preview-ReadOnly-Round-Audit/1.0",
              })
              try:
                  with urllib.request.urlopen(request,timeout=50) as response:
                      status=response.status
                      data=json.loads(response.read(30000))
              except urllib.error.HTTPError as ex:
                  status=ex.code
                  try: data=json.loads(ex.read(1000))
                  except Exception: data={}
              except Exception as ex:
                  status=0
                  data={"error":type(ex).__name__}
              if status==200 and data.get("readOnly") is True:
                  print("AUDIT_STATUS: success")
                  print("PAGES_READ:",data.get("pagesRead"))
                  print("PAGES_COMPLETE:",data.get("pagesComplete"))
                  print("CUSTOMER_RECORDS:",data.get("customerRecordsInspected"))
                  print("RECOGNIZED_TOWN_CUSTOMERS:",data.get("customersWithRecognizedTowns"))
                  print("GROUP_ASSIGNMENTS:",data.get("customerGroupAssignments"))
                  print("UNMATCHED_GROUP_IDS:",data.get("unresolvedGroupAssignments"))
                  print("UNKNOWN_TOWN_ASSIGNMENTS:",data.get("unknownTownAssignments"))
                  print("GROUPS:",json.dumps(data.get("groups") or [],ensure_ascii=True))
                  break
              print("TRY:",attempt,"HTTP_STATUS:",status,"ERROR:",data.get("error","unavailable"))
              if attempt==10: raise SystemExit("Read-only mapping audit did not finish")
              time.sleep(8)
