name: Squeegee preview booking integration tests
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - netlify/functions/lib/squeegeeApiV3.js
      - netlify/functions/lib/squeegeeBookingPlan.js
      - netlify/functions/lib/squeegeeBookingPricing.js
      - netlify/functions/lib/squeegeeScheduleCheck.js
      - netlify/functions/lib/squeegeeCustomerMatcher.js
      - netlify/functions/lib/squeegeeServiceCatalog.js
      - netlify/functions/lib/squeegeeBookingPreparation.js
      - netlify/functions/lib/squeegeeBookingStage.js
      - netlify/functions/lib/squeegeeIdempotencyClaims.js
      - netlify/functions/lib/squeegeeRoundAnalysis.js
      - netlify/functions/lib/squeegeeRoundCycle.js
      - netlify/functions/sendBookingEmail.js
      - netlify/functions/sendTosReceipt.js
      - tests/squeegee-integration.test.cjs
      - tests/squeegee-booking-pricing.test.cjs
      - tests/squeegee-schedule-check.test.cjs
      - tests/squeegee-booking-preparation.test.cjs
      - tests/squeegee-idempotency-claims.test.cjs
      - tests/squeegee-round-analysis.test.cjs
      - tests/squeegee-round-cycle.test.cjs
      - .github/workflows/squeegee-preview-tests.yml

permissions:
  contents: read

jobs:
  test-squeegee-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test dates, prices, customer matching and job mapping (no live API calls)
        run: node --test tests/squeegee-*.test.cjs
