name: Inspect Squeegee API documentation (preview only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-docs-introspect.yml

permissions:
  contents: read

jobs:
  inspect-api-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retrieve public developer docs (GET only, no API key)
        shell: python
        run: |
          import urllib.request
          url = "https://api02.sqgee.com/api/v3/docs"
          req = urllib.request.Request(url, headers={"User-Agent":"NI-Bin-Guy-Preview-Docs/1.0"})
          with urllib.request.urlopen(req, timeout=20) as response:
              page = response.read(150000).decode("utf-8","replace")
              print("DOCS_HTTP_STATUS:",response.status)
          print("___SQUEEGEE_DOCS_START___")
          print(page)
          print("___SQUEEGEE_DOCS_END___")
