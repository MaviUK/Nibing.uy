name: Squeegee Preview 1 customer schema probe (GET only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-customer-schema.yml

permissions:
  contents: read

jobs:
  check-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect only customer response FIELD NAMES, not customer values
        shell: python
        run: |
          import json, time, urllib.request, urllib.error
          url="https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeCustomerSchema"
          for n in range(1,11):
              try:
                  request=urllib.request.Request(url,headers={"Accept":"application/json"})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      status=response.status
                      data=json.loads(response.read(30000))
              except urllib.error.HTTPError as exc:
                  status=exc.code
                  try: data=json.loads(exc.read(2000))
                  except Exception: data={}
              except Exception:
                  status=0
                  data={}
              if status==200 and data.get("readOnly") is True:
                  print("SCHEMA_STATUS: success")
                  for key in ("topLevelKeys","topLevelFieldTypes","customerKeys","customerJobArray","jobsCountInOneRecord","firstJobKeys","firstJobFieldTypes","scheduleKeys","scheduleFieldTypes","appointmentsType","appointmentKeys"):
                      print(key.upper()+":",json.dumps(data.get(key)))
                  break
              print("ATTEMPT:",n,"STATUS:",status)
              if n==10: raise SystemExit("Schema probe did not complete")
              time.sleep(7)
