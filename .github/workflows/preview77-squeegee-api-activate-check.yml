name: Preview 1 read-only Squeegee API activation contract check
on:
  push:
    branches: [preview/n64-retro-site]
    paths:
      - .github/workflows/preview77-squeegee-api-activate-check.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET-only public OpenAPI status/update operations (no keys)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          urls=[
           "https://api02.sqgee.com/api/v3/docs-json",
           "https://api02.sqgee.com/api/v3/docs/swagger.json",
           "https://api02.sqgee.com/api/v3/openapi.json",
           "https://api02.sqgee.com/api/v3/swagger.json",
           "https://api02.sqgee.com/api/v3/docs",
          ]
          for url in urls:
           try:
            req=urllib.request.Request(url,headers={"Accept":"application/json,text/html","User-Agent":"NBG-readonly-api-contract-check"})
            with urllib.request.urlopen(req,timeout=9) as res:
             body=res.read(3000000).decode("utf-8","replace")
             print("GET",url,"status",res.status,"type",res.headers.get("content-type"),"bytes",len(body))
             try:
              data=json.loads(body)
              paths=data.get("paths") or {}
              found=[(p,list(x.keys())) for p,x in paths.items() if "customer" in p.lower() or any(y in p.lower() for y in ["active","status","reactiv"])]
              print("CUSTOMER METHODS",json.dumps(found)[:8000])
             except Exception:
              import re
              print("SWAGGER CONFIG URLS",re.findall(r"[^\\\"']+(?:json|swagger-ui-init\\.js)",body)[:10])
              for needle in ["reactivat", "deactivat", "activat", "PATCH", "PUT ", "customer status"]:
               matches=list(re.finditer(needle,body,re.I))
               print("DOC TERM",needle,"count",len(matches))
               for match in matches[:6]:
                snippet=re.sub(r"<[^>]*>"," ",body[max(0,match.start()-120):match.end()+170])
                print("CONTEXT",re.sub(r"\\s+"," ",snippet)[:280])
           except Exception as e:
            print("GET",url,"failed",str(e)[:180])
          PY
