name: Squeegee controlled test booking (preview only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-controlled-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  controlled-test-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify complete customer scan and zero-priced test preflight (NO writes)
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error
          audience="ni-bin-guy-squeegee-preview77-test-20261030"
          identity_url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          identity_token=os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          join="&" if "?" in identity_url else "?"
          url=identity_url+join+urllib.parse.urlencode({"audience":audience})
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+identity_token})
          with urllib.request.urlopen(req,timeout=30) as res:
              id_token=json.load(res)["value"]
          endpoint="https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeControlledTest"
          for attempt in range(1,13):
              request=urllib.request.Request(endpoint,data=b'{"mode":"inspect"}',
                  headers={"Authorization":"Bearer "+id_token,
                           "Content-Type":"application/json"},
                  method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=40) as response:
                      status=response.status
                      body=json.loads(response.read(5000))
              except urllib.error.HTTPError as err:
                  status=err.code
                  try: body=json.loads(err.read(2000))
                  except Exception: body={}
              except Exception:
                  status=0
                  body={}
              if status==200 and body.get("readOnly") and body.get("authenticated"):
                  safe={k:body.get(k) for k in ("readOnly","authenticated","date","round",
                     "frequency","jobPriceGBP","customerHasRealContact",
                     "serviceMapped","groupMapped","externalLookup","lookupErrorStatus",
                     "pagesScanned","customersScanned","scanComplete",
                     "testCustomerFound","ledgerReady","ready")}
                  print("CONTROLLED_TEST_PREFLIGHT:",json.dumps(safe,sort_keys=True))
                  if not body.get("ready"):
                      raise SystemExit("Controlled test is NOT ready; no Squeegee writes were made")
                  break
              print("PREFLIGHT_ATTEMPT:",attempt,"HTTP_STATUS:",status,
                  "REASON:",body.get("error","not ready"))
              if status==401:
                  raise SystemExit("GitHub OIDC authentication rejected; no Squeegee writes")
              if attempt==12: raise SystemExit("Preflight not available; no Squeegee writes")
              time.sleep(8)
