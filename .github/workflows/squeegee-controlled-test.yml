name: Squeegee controlled test booking (preview only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-controlled-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  compare-and-swap-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify one-time atomic state transition; no Squeegee writes
        shell: python
        run: |
          import json,os,time,urllib.parse,urllib.request,urllib.error
          aud="ni-bin-guy-squeegee-preview77-test-20261030"
          base=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url=base+("&" if "?" in base else "?")+urllib.parse.urlencode({"audience":aud})
          req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(req,timeout=30) as response:
              identity=json.load(response)["value"]
          endpoint="https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeControlledTest"
          for attempt in range(1,13):
              request=urllib.request.Request(endpoint,data=b'{"mode":"cas-check"}',
                  headers={"Authorization":"Bearer "+identity,
                           "Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=35) as response:
                      status=response.status
                      body=json.loads(response.read(3000))
              except urllib.error.HTTPError as err:
                  status=err.code
                  try: body=json.loads(err.read(1000))
                  except Exception: body={}
              except Exception:
                  status=0
                  body={}
              if status==200 and body.get("testOnly") and body.get("noSqueegeeWrites"):
                  allowed=("casChanged","casReason","casEtagPresent","casPersisted")
                  print("ATOMIC_CAS_CHECK:",json.dumps({k:body.get(k) for k in allowed},sort_keys=True))
                  if not body.get("casChanged") or not body.get("casPersisted"):
                      raise SystemExit("Atomic claim compare-and-swap failed; no Squeegee writes")
                  break
              print("CAS_ATTEMPT:",attempt,"HTTP:",status)
              if status==401:raise SystemExit("GitHub OIDC rejected")
              if attempt==12:raise SystemExit("CAS diagnostic unavailable")
              time.sleep(8)
