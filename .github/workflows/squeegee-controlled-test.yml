name: Squeegee controlled test booking (preview only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-controlled-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  one-time-approved-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for safe Preview 1 deployment and run one Squeegee test POST sequence ONCE
        shell: python
        run: |
          import json,os,time,urllib.parse,urllib.request,urllib.error
          aud="ni-bin-guy-squeegee-preview77-test-20261030"
          base=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          url=base+("&" if "?" in base else "?")+urllib.parse.urlencode({"audience":aud})
          token_req=urllib.request.Request(url,headers={
              "Authorization":"Bearer "+os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          with urllib.request.urlopen(token_req,timeout=30) as response:
              identity=json.load(response)["value"]
          endpoint="https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeControlledTest"
          headers={"Authorization":"Bearer "+identity,"Content-Type":"application/json"}

          # PRE-FLIGHT GET-ONLY: it performs Squeegee GETs but no Squeegee POST.
          ready=False
          for attempt in range(1,16):
              inspect_req=urllib.request.Request(endpoint,data=b'{"mode":"inspect"}',
                  headers=headers,method="POST")
              try:
                  with urllib.request.urlopen(inspect_req,timeout=50) as response:
                      status=response.status
                      body=json.loads(response.read(5000))
              except urllib.error.HTTPError as e:
                  status=e.code
                  try: body=json.loads(e.read(2000))
                  except Exception: body={}
              except Exception:
                  status=0
                  body={}
              if status==200 and body.get("controlledWriteCodeDeployed") is True:
                  print("PREWRITE_STATUS:",json.dumps({
                      "ready":body.get("ready"),
                      "date":body.get("date"),"round":body.get("round"),
                      "scanComplete":body.get("scanComplete"),
                      "testCustomerFound":body.get("testCustomerFound"),
                  },sort_keys=True))
                  if body.get("ready") is not True:
                      raise SystemExit("Test preflight blocked the single write")
                  ready=True
                  break
              print("WAIT_FOR_SAFE_TEST_DEPLOY:",attempt,"HTTP:",status)
              if status==401:raise SystemExit("GitHub OIDC rejected")
              if attempt==15:raise SystemExit("Safe Preview 1 code unavailable; no writes")
              time.sleep(8)

          if not ready:raise SystemExit("Test not ready")
          # EXACTLY ONE request can trigger the customer+job write sequence.
          # NO retry on HTTP failures, timeouts, connection drops or 5xx.
          execute_req=urllib.request.Request(endpoint,data=b'{"mode":"execute"}',
              headers=headers,method="POST")
          try:
              with urllib.request.urlopen(execute_req,timeout=110) as response:
                  status=response.status
                  body=json.loads(response.read(6000))
          except urllib.error.HTTPError as e:
              status=e.code
              try:body=json.loads(e.read(5000))
              except Exception:body={}
          except Exception:
              print("ONE_SHOT_TEST_RESULT: network_unknown")
              raise SystemExit("Possible partial write. NEVER retry automatically.")

          keys=("status","externalReference","scheduledDate","groupNumber",
                "recurrence","priceGBP","customerCreated","jobCreated",
                "requiresManualVerification","reason","httpStatus","apiCode")
          safe={key:body.get(key) for key in keys if key in body}
          print("ONE_SHOT_TEST_HTTP:",status)
          print("ONE_SHOT_TEST_RESULT:",json.dumps(safe,sort_keys=True))
          if status!=200 or body.get("jobCreated") is not True:
              raise SystemExit("Test was not fully confirmed. DO NOT RETRY.")
