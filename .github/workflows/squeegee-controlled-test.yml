name: Squeegee controlled test booking (preview only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-controlled-test.yml
permissions:
  contents: read
  id-token: write
jobs:
  inspect-blocked-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read only atomic claim and test customer status (NO WRITES)
        shell: python
        run: |
          import json, os, time, urllib.parse, urllib.request, urllib.error
          audience="ni-bin-guy-squeegee-preview77-test-20261030"
          identity_url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          identity_token=os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          url=identity_url+("&" if "?" in identity_url else "?")+urllib.parse.urlencode({"audience":audience})
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+identity_token})
          with urllib.request.urlopen(req,timeout=30) as res:
              id_token=json.load(res)["value"]
          endpoint="https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeControlledTest"
          for attempt in range(1,13):
              request=urllib.request.Request(endpoint,data=b'{"mode":"claim-status"}',
                  headers={"Authorization":"Bearer "+id_token,"Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(request,timeout=50) as response:
                      status=response.status
                      body=json.loads(response.read(3000))
              except urllib.error.HTTPError as e:
                  status=e.code
                  try: body=json.loads(e.read(1000))
                  except Exception: body={}
              except Exception:
                  status=0
                  body={}
              if status==200 and body.get("readOnly") and body.get("authenticated"):
                  safe={key:body.get(key) for key in ("claimExists","claimState","claimHasEtag",
                      "scanComplete","existingTestCustomer","customerPagesScanned","customersScanned")}
                  print("CLAIM_AUDIT_RESULT:",json.dumps(safe,sort_keys=True))
                  break
              print("CLAIM_AUDIT_ATTEMPT:",attempt,"HTTP:",status)
              if status==401:raise SystemExit("Signed auth rejected")
              if attempt==12:raise SystemExit("Read-only claim check not available")
              time.sleep(8)
