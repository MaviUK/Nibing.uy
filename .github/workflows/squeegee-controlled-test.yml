name: Squeegee controlled test booking (preview only)
on:
  push:
    branches:
      - preview/n64-retro-site
    paths:
      - .github/workflows/squeegee-controlled-test.yml

permissions:
  contents: read
  id-token: write

jobs:
  inspect-blob-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test Netlify Blobs storage only; no Squeegee writes
        shell: python
        run: |
          import json,os,time,urllib.parse,urllib.request,urllib.error
          audience="ni-bin-guy-squeegee-preview77-test-20261030"
          identity_url=os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          identity_token=os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          url=identity_url+("&" if "?" in identity_url else "?")+urllib.parse.urlencode({"audience":audience})
          token_req=urllib.request.Request(url,headers={"Authorization":"Bearer "+identity_token})
          with urllib.request.urlopen(token_req,timeout=30) as response:
              identity=json.load(response)["value"]
          endpoint="https://deploy-preview-77--nibinguy.netlify.app/.netlify/functions/squeegeeControlledTest"
          for attempt in range(1,13):
              req=urllib.request.Request(endpoint,data=b'{"mode":"storage-check"}',
                  headers={"Authorization":"Bearer "+identity,
                           "Content-Type":"application/json"},method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=40) as response:
                      status=response.status
                      body=json.loads(response.read(3000))
              except urllib.error.HTTPError as err:
                  status=err.code
                  try: body=json.loads(err.read(1000))
                  except Exception: body={}
              except Exception:
                  status=0
                  body={}
              if status==200 and body.get("testOnly") and body.get("noSqueegeeWrites"):
                  allowed=("conditionalModified","conditionalEtagPresent",
                      "conditionalError","conditionalPersisted",
                      "plainModified","plainEtagPresent","plainError","plainPersisted")
                  print("BLOB_STORAGE_CHECK:",json.dumps({k:body.get(k) for k in allowed},sort_keys=True))
                  break
              print("BLOB_STORAGE_ATTEMPT:",attempt,"HTTP:",status)
              if status==401:raise SystemExit("GitHub-signed auth rejected")
              if attempt==12:raise SystemExit("Harmless Netlify Blobs check unavailable")
              time.sleep(8)
