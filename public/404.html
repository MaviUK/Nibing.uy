<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>Page Not Found | Ni Bin Guy</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #09090b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(560px, 100%);
      text-align: center;
      padding: 40px 28px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 24px;
      background: #18181b;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    img { width: min(210px, 65vw); height: auto; margin-bottom: 24px; }
    .code { color: #4ade80; font-size: 14px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 10px 0 12px; font-size: clamp(30px, 7vw, 48px); line-height: 1.05; }
    p { margin: 0 auto 26px; max-width: 430px; color: #d4d4d8; line-height: 1.6; }
    a {
      display: inline-block;
      padding: 13px 20px;
      border-radius: 12px;
      background: #22c55e;
      color: #07130a;
      text-decoration: none;
      font-weight: 800;
    }
    a:hover, a:focus { background: #4ade80; outline: none; }
  </style>
</head>
<body>
  <main>
    <img src="/logo.webp" alt="Ni Bin Guy">
    <div class="code">404 · Page not found</div>
    <h1>That page isn’t here.</h1>
    <p>The address may be incorrect or the page may have moved. Head back to the Ni Bin Guy homepage to book a clean or view our services.</p>
    <a href="/">Back to homepage</a>
  </main>
</body>
</html>
