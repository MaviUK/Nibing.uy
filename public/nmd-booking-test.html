<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NMD Bin Date Test | NI Bin Guy</title><style>:root{font-family:Inter,system-ui,sans-serif}body{margin:0;background:#f5f7f6;color:#13221a}main{width:min(720px,calc(100% - 28px));margin:30px auto}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 16px 44px rgba(15,45,30,.09)}h1{margin:0 0 10px;font-size:clamp(28px,5vw,40px)}p{line-height:1.5}.tag{display:inline-flex;background:#e8f4ec;color:#176238;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;margin-bottom:14px}form{display:grid;gap:12px;margin-top:20px}input,select{border:1px solid #b9c7bf;border-radius:12px;padding:14px 16px;font-size:17px;background:#fff}input{text-transform:uppercase}button{border:0;border-radius:12px;padding:15px 20px;background:#14723e;color:#fff;font-weight:800;font-size:16px}#status{display:none;margin-top:18px;border-radius:14px;padding:16px}.good{display:block!important;background:#e9f7ee;border:1px solid #9ed7b5}.warn{display:block!important;background:#fff6dd;border:1px solid #efd17a}.bad{display:block!important;background:#feecec;border:1px solid #efaaaa}.dates{display:none;margin-top:20px}.dates.visible{display:block}.date{background:#f2f6f3;border-radius:14px;padding:16px;margin:10px 0;font-size:22px;font-weight:800}.small{font-size:13px;color:#5d6b63}details{margin-top:18px}pre{white-space:pre-wrap;word-break:break-word;background:#101915;color:#d9e7df;padding:14px;border-radius:12px;font-size:12px}</style></head><body><main><section class="card"><div class="tag">Temporary council test</div><h1>NMD next two bin days</h1><p>Enter a Newry, Mourne &amp; Down postcode and choose the bin. This test only checks the council schedule — it does not create a booking or send an email.</p><form id="f"><input id="postcode" autocomplete="postal-code" placeholder="e.g. BT33 0HB" required><select id="bin"><option value="BLACK">Black bin</option><option value="BLUE">Blue bin</option><option value="BROWN">Brown bin</option></select><button id="btn">Find next 2 empty days</button></form><div id="status"></div><section id="dates" class="dates"><h2>Next two council empty days</h2><div id="dateList"></div></section><details><summary>Technical details</summary><pre id="raw"></pre></details></section></main><script>const f=document.getElementById('f'),pc=document.getElementById('postcode'),bin=document.getElementById('bin'),btn=document.getElementById('btn'),status=document.getElementById('status'),dates=document.getElementById('dates'),dateList=document.getElementById('dateList'),raw=document.getElementById('raw');const fmt=d=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00Z'));f.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Checking council…';status.className='warn';status.innerHTML='<strong>Checking postcode against the council calendar…</strong>';dates.classList.remove('visible');dateList.innerHTML='';try{const r=await fetch(`/.netlify/functions/nmdBinLookup?postcode=${encodeURIComponent(pc.value.trim())}&bin=${encodeURIComponent(bin.value)}`,{cache:'no-store'}),d=await r.json();raw.textContent=JSON.stringify(d,null,2);if(!r.ok||d.error){status.className='bad';status.innerHTML='<strong>Lookup failed:</strong> '+(d.error||'Unknown error');return}if(d.matched&&Array.isArray(d.nextTwoCollectionDates)&&d.nextTwoCollectionDates.length===2){status.className='good';status.innerHTML=`<strong>Matched:</strong> ${d.postcode} — ${bin.options[bin.selectedIndex].text}`;dateList.innerHTML=d.nextTwoCollectionDates.map((x,i)=>`<div class="date">${i+1}. ${fmt(x)}</div>`).join('');dates.classList.add('visible')}else{status.className='warn';status.innerHTML='<strong>Not fully matched yet.</strong> The council responded, but I could not identify the postcode-specific calendar. Open Technical details below if needed.'}}catch(err){status.className='bad';status.innerHTML='<strong>Test failed:</strong> '+err.message}finally{btn.disabled=false;btn.textContent='Find next 2 empty days'}});</script></body></html>
