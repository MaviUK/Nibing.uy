<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>NMD Bin Date Test | NI Bin Guy</title><style>:root{font-family:Inter,system-ui,sans-serif}body{margin:0;background:#f5f7f6;color:#13221a}main{width:min(720px,calc(100% - 28px));margin:30px auto}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 16px 44px rgba(15,45,30,.09)}h1{margin:0 0 10px;font-size:clamp(28px,5vw,40px)}p{line-height:1.5}.tag{display:inline-flex;background:#e8f4ec;color:#176238;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;margin-bottom:14px}form{display:grid;gap:12px;margin-top:20px}input,select{border:1px solid #b9c7bf;border-radius:12px;padding:14px 16px;font-size:17px;background:#fff}input{text-transform:uppercase}button{border:0;border-radius:12px;padding:15px 20px;background:#14723e;color:#fff;font-weight:800;font-size:16px}button.secondary{background:#0ba8b5;text-align:left;margin:8px 0;width:100%}button:disabled{opacity:.6}#status{display:none;margin-top:18px;border-radius:14px;padding:16px}.good{display:block!important;background:#e9f7ee;border:1px solid #9ed7b5}.warn{display:block!important;background:#fff6dd;border:1px solid #efd17a}.bad{display:block!important;background:#feecec;border:1px solid #efaaaa}.panel{display:none;margin-top:20px}.panel.visible{display:block}.date{background:#f2f6f3;border-radius:14px;padding:16px;margin:10px 0;font-size:22px;font-weight:800}.small{font-size:13px;color:#5d6b63}details{margin-top:18px}pre{white-space:pre-wrap;word-break:break-word;background:#101915;color:#d9e7df;padding:14px;border-radius:12px;font-size:12px}</style></head><body><main><section class="card"><div class="tag">Temporary council test</div><h1>NMD next two bin days</h1><p>Enter a Newry, Mourne &amp; Down postcode. The test will show the addresses returned by the council, then you can choose the correct address and bin.</p><form id="f"><input id="postcode" autocomplete="postal-code" placeholder="e.g. BT34 2FL" required><select id="bin"><option value="BLACK">Black bin</option><option value="BLUE">Blue bin</option><option value="BROWN">Brown bin</option></select><button id="btn">Find council addresses</button></form><div id="status"></div><section id="addresses" class="panel"><h2>Select your address</h2><div id="addressList"></div></section><section id="dates" class="panel"><h2>Next two council empty days</h2><div id="dateList"></div></section><details><summary>Technical details</summary><pre id="raw"></pre></details></section></main><script>const f=document.getElementById('f'),pc=document.getElementById('postcode'),bin=document.getElementById('bin'),btn=document.getElementById('btn'),status=document.getElementById('status'),addresses=document.getElementById('addresses'),addressList=document.getElementById('addressList'),dates=document.getElementById('dates'),dateList=document.getElementById('dateList'),raw=document.getElementById('raw');const fmt=d=>new Intl.DateTimeFormat('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00Z'));function show(kind,msg){status.className=kind;status.innerHTML=msg}function renderDates(d,label){show('good',`<strong>Matched:</strong> ${label} — ${bin.options[bin.selectedIndex].text}`);dateList.innerHTML=d.nextTwoCollectionDates.map((x,i)=>`<div class="date">${i+1}. ${fmt(x)}</div>`).join('');dates.classList.add('visible')}async function loadSchedule(index,label){addresses.classList.remove('visible');dates.classList.remove('visible');show('warn','<strong>Opening council schedule for '+label+'…</strong>');try{const r=await fetch(`/.netlify/functions/nmdBinLookup?postcode=${encodeURIComponent(pc.value.trim())}&bin=${encodeURIComponent(bin.value)}&addressIndex=${encodeURIComponent(index)}`,{cache:'no-store'}),d=await r.json();raw.textContent=JSON.stringify(d,null,2);if(!r.ok||d.error){show('bad','<strong>Schedule lookup failed:</strong> '+(d.error||'Unknown error'));return}if(d.matched&&Array.isArray(d.nextTwoCollectionDates)&&d.nextTwoCollectionDates.length===2){renderDates(d,label);return}if(String(d.contentType||'').toLowerCase().includes('pdf')&&d.source){show('warn','<strong>Reading the council PDF…</strong>');const pr=await fetch(`/.netlify/functions/nmdPdfDates?pdfUrl=${encodeURIComponent(d.source)}&bin=${encodeURIComponent(bin.value)}`,{cache:'no-store'}),pd=await pr.json();raw.textContent=JSON.stringify({schedule:d,pdf:pd},null,2);if(pr.ok&&pd.matched&&Array.isArray(pd.nextTwoCollectionDates)&&pd.nextTwoCollectionDates.length===2){renderDates(pd,label);return}if(!pr.ok||pd.error){show('bad','<strong>PDF date lookup failed:</strong> '+(pd.error||'Unknown error'));return}}show('warn','<strong>Address schedule opened.</strong> The council PDF was reached, but I still could not identify two future '+bin.options[bin.selectedIndex].text.toLowerCase()+' dates. Technical details are below.')}catch(e){show('bad','<strong>Test failed:</strong> '+e.message)}}f.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Checking council…';addresses.classList.remove('visible');dates.classList.remove('visible');addressList.innerHTML='';show('warn','<strong>Finding addresses from Newry, Mourne & Down Council…</strong>');try{const r=await fetch(`/.netlify/functions/nmdBinLookup?postcode=${encodeURIComponent(pc.value.trim())}&bin=${encodeURIComponent(bin.value)}`,{cache:'no-store'}),d=await r.json();raw.textContent=JSON.stringify(d,null,2);if(!r.ok||d.error){show('bad','<strong>Lookup failed:</strong> '+(d.error||'Unknown error'));return}if(d.stage==='addresses'&&Array.isArray(d.addresses)&&d.addresses.length){show('good',`<strong>${d.addresses.length} council address${d.addresses.length===1?'':'es'} found.</strong> Select the correct property below.`);d.addresses.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='secondary';b.textContent=a.label;b.addEventListener('click',()=>loadSchedule(a.index,a.label));addressList.appendChild(b)});addresses.classList.add('visible')}else show('warn','<strong>The council responded,</strong> but I could not pair the returned View Schedule controls with addresses yet. Open Technical details below.')}catch(err){show('bad','<strong>Test failed:</strong> '+err.message)}finally{btn.disabled=false;btn.textContent='Find council addresses'}});</script></body></html>
