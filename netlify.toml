# Production deploy trigger: 2026-08-11T20:39+01:00

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    Content-Security-Policy = """
      default-src 'self';
      base-uri 'self';
      object-src 'none';
      frame-ancestors 'none';
      form-action 'self';
      upgrade-insecure-requests;
      block-all-mixed-content;

      img-src 'self' data: https:;
      font-src 'self' data: https:;

      style-src 'self' 'unsafe-inline' https:;
      style-src-elem 'self' 'unsafe-inline' https:;

      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://maps.googleapis.com
        https://maps.gstatic.com
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://apps.elfsight.com
        https://*.elfsight.com
        https://widgets.sqg.ee
        https://*.sqg.ee
        https://sqgee.com
        https://*.sqgee.com
        https://js.stripe.com;

      script-src-elem 'self' 'unsafe-inline' 'unsafe-eval'
        https://maps.googleapis.com
        https://maps.gstatic.com
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://apps.elfsight.com
        https://*.elfsight.com
        https://widgets.sqg.ee
        https://*.sqg.ee
        https://sqgee.com
        https://*.sqgee.com
        https://js.stripe.com;

      connect-src 'self' https: wss:
        https://maps.googleapis.com
        https://maps.gstatic.com
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://apps.elfsight.com
        https://*.elfsight.com
        https://widgets.sqg.ee
        https://*.sqg.ee
        https://sqgee.com
        https://*.sqgee.com
        https://api.stripe.com
        https://r.stripe.com
        https://m.stripe.com;

      frame-src 'self' https:
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://*.sqg.ee
        https://*.sqgee.com
        https://sqgee.com
        https://js.stripe.com
        https://hooks.stripe.com;
    """

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/bins/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Keep one canonical URL for every town page. Without these rules, a trailing
# slash on an extensionless static town file can fall through to the SPA
# homepage and create a duplicate/soft-404 URL for search engines.
[[redirects]]
  from = "/bin-cleaning-bangor"
  to = "/bin-cleaning-bangor/"
  status = 301
  force = true

