# ISOLATED CONCEPT BRANCH ONLY.
# This configuration is intentionally different from production.
# Do not merge this branch into main.
[build]
  command = "echo 'Building static NI Bin Guy commercial concept preview'"
  publish = "commercial-corporate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
