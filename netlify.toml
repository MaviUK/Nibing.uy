# Production release: 2026-11-09 approved Squeegee API auto-booking flags

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    Content-Security-Policy = """
      default-src 'self';
      base-uri 'self';
      object-src 'none';
      frame-ancestors 'none';
      form-action 'self';
      upgrade-insecure-requests;
      block-all-mixed-content;

      img-src 'self' data: https:;
      font-src 'self' data: https:;

      style-src 'self' 'unsafe-inline' https:;
      style-src-elem 'self' 'unsafe-inline' https:;

      script-src 'self' 'unsafe-inline' 'unsafe-eval'
        https://maps.googleapis.com
        https://maps.gstatic.com
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://apps.elfsight.com
        https://*.elfsight.com
        https://widgets.sqg.ee
        https://*.sqg.ee
        https://sqgee.com
        https://*.sqgee.com
        https://js.stripe.com;

      script-src-elem 'self' 'unsafe-inline' 'unsafe-eval'
        https://maps.googleapis.com
        https://maps.gstatic.com
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://apps.elfsight.com
        https://*.elfsight.com
        https://widgets.sqg.ee
        https://*.sqg.ee
        https://sqgee.com
        https://*.sqgee.com
        https://js.stripe.com;

      connect-src 'self' https: wss:
        https://maps.googleapis.com
        https://maps.gstatic.com
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://apps.elfsight.com
        https://*.elfsight.com
        https://widgets.sqg.ee
        https://*.sqg.ee
        https://sqgee.com
        https://*.sqgee.com
        https://api.stripe.com
        https://r.stripe.com
        https://m.stripe.com;

      frame-src 'self' https:
        https://www.google.com
        https://www.gstatic.com
        https://www.google.com/recaptcha/
        https://www.gstatic.com/recaptcha/
        https://*.sqg.ee
        https://*.sqgee.com
        https://sqgee.com
        https://js.stripe.com
        https://hooks.stripe.com;
    """

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/bins/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# Keep the N64 test scoreboard script fresh: the generic JS cache rule above
# previously let Android retain an older local-XP-only HUD after deploys.
# Customer HQ needs this script to load promptly to display verified total XP.
[[headers]]
  for = "/n64-scoreboard.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"

# Preview 1 PR #77 safety gate: run fake-only Squeegee regression tests
# before publishing any function that can write to the owner's Squeegee account.
# This file is modified ONLY on preview/n64-retro-site, not main or Preview 2.
[build]
  command = "node --test tests/squeegee-*.test.cjs && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Package the existing NI Bin Guy logo only with functions that create
# signed Terms PDFs. This removes the live-site fetch on each booking without
# adding a 1 MB image to every Netlify function.
[functions.sendBookingEmail]
  included_files = ["public/logo.png", "netlify/functions/lib/assets/terms-september-2026-master.pdf"]


[functions.sendStreetBookingEmail]
