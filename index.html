  <script>
    (function () {
      const logos = ["/logo.webp", "/logo2.webp", "/logo3.webp", "/logo4.webp", "/logo5.webp"];
      const storageKey = "nbg_last_logo_index";
      function pickLogo() { let lastIndex = -1; try { lastIndex = Number(window.localStorage.getItem(storageKey)); } catch (error) { lastIndex = -1; } const availableIndexes = logos.map((_, index) => index).filter((index) => index !== lastIndex); const nextIndex = availableIndexes[Math.floor(Math.random() * availableIndexes.length)] ?? 0; try { window.localStorage.setItem(storageKey, String(nextIndex)); } catch (error) {} return logos[nextIndex]; }
      const selectedLogo = pickLogo();
      function applySelectedLogo() { const logoImages = document.querySelectorAll('img[alt*="Ni Bin Guy"], img[src$="logo.webp"]'); logoImages.forEach((img) => { const currentSrc = img.getAttribute("src") || ""; const looksLikeLogo = currentSrc.includes("logo.webp") || /logo[2-5]\.webp$/i.test(currentSrc) || img.alt.includes("Ni Bin Guy"); if (!looksLikeLogo || img.dataset.randomLogoApplied === "true") return; img.dataset.randomLogoApplied = "true"; img.onerror = function () { if (!img.src.endsWith("/logo.png")) img.src = "/logo.png"; }; img.src = selectedLogo; }); }
      if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", applySelectedLogo); } else { applySelectedLogo(); }
      new MutationObserver(applySelectedLogo).observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
